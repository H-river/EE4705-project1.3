# Owner: backbone (ALL)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ee4705-backbone"
version = "0.1.0"
description = "EE4705 Project 1.3 backbone: contracts, sim environment, orchestration, evaluation"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",  # scripts/ik_reach_test.py, scripts/cam_sync_check.py
]

[tool.setuptools]
packages = [
    "core",
    "perception",
    "planner",
    "executor",
    "eval",
    "eval.trials",
]

[tool.setuptools.package-data]
"eval.trials" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # keep pytest and python -m pytest equivalent for tests.conftest imports
# This machine has ROS Jazzy on PYTHONPATH; its pytest plugins break inside
# the isolated venv (missing transitive deps), so disable them explicitly.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"
